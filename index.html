<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBox Cloud</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #030712; color: #f3f4f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #111827; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #1f2937; }
        h1 { font-size: 22px; margin-top: 0; color: #818cf8; display: flex; align-items: center; gap: 10px; }
        .btn { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #4338ca; }
        input[type="file"] { display: none; }
        .file-box { border: 2px dashed #374151; padding: 20px; text-align: center; border-radius: 12px; margin: 15px 0; background: #0f172a; }
        .file-list { margin-top: 20px; max-height: 250px; overflow-y: auto; }
        .file-item { background: #1f2937; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .delete-btn { color: #f87171; background: none; border: none; cursor: pointer; font-size: 16px; }
        .storage-info { font-size: 12px; color: #9ca3af; margin-top: 15px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="container">
        <h1>☁️ SkyBox BYOS Drive</h1>
        <p style="color: #9ca3af; font-size: 14px;">Your private 2TB browser cloud storage.</p>

        <div class="file-box">
            <p style="margin: 0 0 10px 0; font-size: 14px; color: #d1d5db;">Select files to store locally</p>
            <button class="btn" onclick="document.getElementById('fileInput').click()">Upload File</button>
            <input type="file" id="fileInput" multiple onchange="uploadFiles(event)">
        </div>

        <div class="storage-info">
            <span id="storageText">Storage Used: 0 MB / 2 TB</span>
            <span>Status: Online</span>
        </div>

        <div class="file-list" id="fileList">
            <!-- Uploaded files will show here -->
        </div>
    </div>

    <script>
        let files = JSON.parse(localStorage.getItem('skybox_files') || '[]');

        function render() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            
            if (files.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6b7280; font-size: 13px;">No files uploaded yet.</p>';
            }

            let totalSize = 0;
            files.forEach((file, index) => {
                totalSize += file.size;
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">${file.name}</span>
                    <div>
                        <span style="font-size: 12px; color: #9ca3af; margin-right: 10px;">${(file.size / 1024 / 1024).toFixed(2)} MB</span>
                        <button class="delete-btn" onclick="removeFile(${index})">✕</button>
                    </div>
                `;
                list.appendChild(div);
            });

            document.getElementById('storageText').innerText = `Storage Used: ${(totalSize / 1024 / 1024).toFixed(2)} MB / 2 TB`;
            localStorage.setItem('skybox_files', JSON.stringify(files));
        }

        function uploadFiles(event) {
            const uploaded = event.target.files;
            for (let f of uploaded) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    files.push({ name: f.name, size: f.size, data: e.target.result });
                    render();
                };
                reader.readAsDataURL(f);
            }
        }

        function removeFile(index) {
            files.splice(index, 1);
            render();
        }

        render();
    </script>
</body>
</html
