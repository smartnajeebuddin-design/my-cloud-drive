<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBox BYOS Cloud Drive</title>
    <!-- PWA Manifest & Theme Integration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2913/2913977.png">
    
    <!-- Tailwind CSS CDN for Modern Dashboard Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-indigo-500/30">
                <i class="fa-solid font-bold fa-cloud"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-white">SkyBox Cloud</h1>
                <p class="text-xs text-indigo-400 font-medium">BYOS 2TB Drive</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs font-semibold text-emerald-400">Online</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 space-y-6">

        <!-- Storage Card Stats -->
        <div class="bg-gradient-to-r from-indigo-900/40 via-slate-900 to-slate-900 border border-indigo-500/20 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Storage Capacity</h2>
                    <p class="text-2xl md:text-3xl font-extrabold text-white mt-1" id="storageUsedText">0.00 MB <span class="text-slate-500 text-lg font-normal">/ 2,000 GB</span></p>
                </div>
                <div class="p-3 bg-indigo-500/10 rounded-xl border border-indigo-500/20 text-indigo-400">
                    <i class="fa-solid fa-hard-drive text-2xl"></i>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                <div id="progressBar" class="bg-indigo-500 h-full rounded-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Upload Action Area -->
        <div class="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 transition-colors bg-slate-900/50 rounded-2xl p-8 text-center flex flex-col items-center justify-center cursor-pointer group" onclick="document.getElementById('fileInput').click()">
            <div class="w-16 h-16 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h3 class="text-lg font-semibold text-white">Upload Your Files</h3>
            <p class="text-sm text-slate-400 mt-1 max-w-xs">Drag and drop or tap to select files to store securely in your local browser storage.</p>
            <button class="mt-5 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/25">
                Browse Files
            </button>
            <input type="file" id="fileInput" multiple class="hidden" onchange="uploadFiles(event)">
        </div>

        <!-- File List Section -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Stored Files</h3>
                <span id="fileCount" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-medium">0 files</span>
            </div>

            <div id="fileList" class="space-y-2">
                <!-- Dynamically populated files -->
            </div>
        </div>

    </main>

    <!-- PWA & Application Script -->
    <script>
        // Register Service Worker for PWABuilder & PWA compliance
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered!'))
                    .catch(err => console.error('SW registration failed:', err));
            });
        }

        let files = JSON.parse(localStorage.getItem('skybox_files') || '[]');

        function render() {
            const list = document.getElementById('fileList');
            const fileCount = document.getElementById('fileCount');
            const storageText = document.getElementById('storageUsedText');
            const progressBar = document.getElementById('progressBar');
            
            list.innerHTML = '';
            fileCount.innerText = `${files.length} file${files.length === 1 ? '' : 's'}`;

            if (files.length === 0) {
                list.innerHTML = `
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-8 text-center text-slate-500">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-600"></i>
                        <p class="text-sm">No files uploaded yet.</p>
                    </div>
                `;
            }

            let totalBytes = 0;
            files.forEach((file, index) => {
                totalBytes += file.size;
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                
                const item = document.createElement('div');
                item.className = 'bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 flex items-center justify-between transition-colors';
                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="p-2.5 bg-slate-800 text-indigo-400 rounded-lg">
                            <i class="fa-regular fa-file"></i>
                        </div>
                        <div class="truncate">
                            <p class="text-sm font-medium text-white truncate">${file.name}</p>
                            <p class="text-xs text-slate-500">${sizeMB} MB</p>
                        </div>
                    </div>
                    <button onclick="removeFile(${index})" class="text-slate-500 hover:text-red-400 p-2 rounded-lg hover:bg-slate-800 transition-colors">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                list.appendChild(item);
            });

            const totalMB = (totalBytes / 1024 / 1024).toFixed(2);
            storageText.innerHTML = `${totalMB} MB <span class="text-slate-500 text-lg font-normal">/ 2,000 GB</span>`;
            
            // Calculate progress out of 2TB (2,000,000 MB)
            const percent = Math.min((totalMB / 2000000) * 100, 100);
            progressBar.style.width = `${Math.max(percent, 1)}%`;

            localStorage.setItem('skybox_files', JSON.stringify(files));
        }

        function uploadFiles(event) {
            const uploaded = event.target.files;
            for (let f of uploaded) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    files.push({ name: f.name, size: f.size, data: e.target.result });
                    render();
                };
                reader.readAsDataURL(f);
            }
        }

        function removeFile(index) {
            files.splice(index, 1);
            render();
        }

        render();
    </script>
</body>
</html>
